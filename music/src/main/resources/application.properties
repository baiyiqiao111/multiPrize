spring.application.name=music

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/music?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Los_Angeles
spring.datasource.username=root
spring.datasource.password=root

# 必须与 serverTimezone、JVM 默认时区保持一致，否则 Jackson 默认按 UTC 输出，
# 返回给调用方的时间会比数据库里的快 7 小时（冬令时是 8 小时）
spring.jackson.time-zone=America/Los_Angeles

mybatis.mapper-locations=classpath:mapper/*.xml
# QQ邮件配置
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=1445079235@qq.com
spring.mail.password=rvqvhwonzoyqbagb
spring.mail.default-encoding=UTF-8

# SSL配置（使用465端口时必须）
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.qq.com

# 其他SMTP配置
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========Kafka基础配置==========
# kafka服务地址，多个逗号分隔
spring.kafka.bootstrap-servers=127.0.0.1:9092

# ==========生产者配置(发送消息)==========
# key序列化
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# value序列化
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# 消息确认机制 0:无需确认 1:leader落盘确认 all:所有副本落盘
spring.kafka.producer.acks=1
# 重试次数
spring.kafka.producer.retries=3
# 批量发送缓冲区大小
spring.kafka.producer.batch-size=16384
# 生产者内存缓冲区
spring.kafka.producer.buffer-memory=33554432

# ==========消费者配置(监听消息)==========
# 消费者分组id，同组消息只能被一个消费者消费
spring.kafka.consumer.group-id=music-group
# key反序列化
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# value反序列化
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# 首次消费策略 earliest:从头消费 latest:只消费新消息 none:没有偏移量报错
spring.kafka.consumer.auto-offset-reset=earliest
# 自动提交offset true自动 false手动
spring.kafka.consumer.enable-auto-commit=true
# 自动提交间隔ms
spring.kafka.consumer.auto-commit-interval=1000
# 单次拉取最大条数
spring.kafka.consumer.max-poll-records=500

# ==========监听容器配置==========
# 并发消费数量(分区数>=并发数)
spring.kafka.listener.concurrency=3
# 手动提交配置时开启批量监听
#spring.kafka.listener.type=batch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n
logging.level.root=INFO
logging.level.com.xxx=DEBUG
logging.file.name=logs/app.log
# MinIO服务地址
minio.endpoint=http://127.0.0.1:9000
# 访问密钥账号
minio.access-key=minioadmin
# 访问密钥密码
minio.secret-key=minioadmin
# 默认存储桶名称
minio.bucket-name=music
# 文件访问域名
minio.domain=http://127.0.0.1:9000

# 文件上传大小限制（音频文件较大）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
