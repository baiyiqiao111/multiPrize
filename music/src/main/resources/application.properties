# ========== Kafka 基础配置 ==========
spring.kafka.bootstrap-servers=107.22.136.67:9092


# ========== Kafka Producer ==========
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# 单节点 Kafka 也可以使用 all，提高可靠性
spring.kafka.producer.acks=all

# 发送失败自动重试
spring.kafka.producer.retries=3

# 单批数据大小 16KB
spring.kafka.producer.batch-size=16384

# t3.micro 内存较小，从 32MB 降到 8MB
spring.kafka.producer.buffer-memory=8388608

# 稍微等待几毫秒，提高批量发送效率
spring.kafka.producer.properties.linger.ms=5

# 压缩消息，减少网络和磁盘占用
spring.kafka.producer.properties.compression.type=lz4


# ========== Kafka Consumer ==========
spring.kafka.consumer.group-id=music-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.auto-offset-reset=earliest

# 推荐让 Spring Kafka 管理 offset，而不是 Kafka consumer 自己定时提交
spring.kafka.consumer.enable-auto-commit=false

# t3.micro 降低单次拉取数量
spring.kafka.consumer.max-poll-records=100


# ========== Kafka Listener ==========
# 单机测试 + 小内存环境先使用 1
spring.kafka.listener.concurrency=1

# 一批消息处理成功以后提交 offset
spring.kafka.listener.ack-mode=batch
spring.kafka.listener.auto-startup=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n
logging.level.root=INFO
logging.level.com.xxx=DEBUG
logging.file.name=logs/app.log

