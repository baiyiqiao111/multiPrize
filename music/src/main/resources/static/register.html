<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 音乐管理</title>
  <link rel="stylesheet" href="css/qqmusic.css">
</head>
<body class="qm-auth">
  <div class="auth-card">
    <div class="logo">♪</div>
    <h1>注册账号</h1>
    <div class="sub">创建账号，开启你的音乐世界</div>

    <div class="field">
      <label>用户名 *</label>
      <input id="name" autocomplete="username" placeholder="请输入用户名" />
    </div>
    <div class="field">
      <label>密码 *</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="请输入密码" />
    </div>
    <div class="field">
      <label>邮箱</label>
      <input id="email" type="email" placeholder="请输入邮箱" />
    </div>
    <div class="field">
      <label>兴趣爱好</label>
      <input id="interests" placeholder="如：流行, 摇滚" />
    </div>
    <div class="row">
      <div class="field">
        <label>年龄</label>
        <input id="age" type="number" min="0" placeholder="年龄" />
      </div>
      <div class="field">
        <label>性别</label>
        <select id="gender"><option value="男">男</option><option value="女">女</option></select>
      </div>
    </div>

    <button class="primary" id="btn" onclick="doRegister()">注 册</button>
    <div class="err" id="err"></div>

    <div class="foot">已有账号？<a href="login.html">返回登录</a></div>
  </div>

  <script>
    const API = "/user";

    function setErr(msg) { document.getElementById("err").textContent = msg || ""; }

    async function doRegister() {
      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value;
      if (!name) return setErr("请输入用户名");
      if (!password) return setErr("请输入密码");

      const payload = {
        name,
        password,
        email: document.getElementById("email").value.trim(),
        interests: document.getElementById("interests").value.trim(),
        age: parseInt(document.getElementById("age").value, 10) || 0,
        gender: document.getElementById("gender").value
      };

      const btn = document.getElementById("btn");
      btn.disabled = true; btn.textContent = "注册中…"; setErr("");

      try {
        const r = await fetch(`${API}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await r.json();
        if (data.success) {
          btn.textContent = "注册成功，正在跳转…";
          setTimeout(() => location.replace("login.html"), 800);
        } else {
          setErr(data.errorMessage || "注册失败");
          btn.disabled = false; btn.textContent = "注 册";
        }
      } catch (e) {
        setErr("请求失败：" + e.message);
        btn.disabled = false; btn.textContent = "注 册";
      }
    }

    // 回车注册
    document.querySelectorAll("input").forEach(el =>
      el.addEventListener("keydown", e => { if (e.key === "Enter") doRegister(); }));
  </script>
</body>
</html>
