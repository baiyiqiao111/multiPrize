server.port=8085

# 服务名即调用方使用的地址（http://prize-sender/...），不能含下划线，否则不是合法主机名
spring.application.name=prize-sender

# ========== 服务注册（Eureka） ==========
# 注册中心地址，部署时可通过环境变量 EUREKA_SERVER_URL 覆盖
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://107.22.136.67:8761/eureka/}
# 以 IP 注册（而不是主机名），IP 变化后实例重启会自动注册新地址
eureka.instance.prefer-ip-address=true
# 注册时上报公网 IP（EC2 网卡上只有内网 IP），保证本地和服务器上的服务都能访问到该实例；可通过环境变量 EUREKA_INSTANCE_IP 覆盖
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:107.22.136.67}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://107.22.136.67:3306/prize_sender?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Los_Angeles
spring.datasource.username=bella
spring.datasource.password=Bella0924@

# 必须与 serverTimezone、JVM 默认时区保持一致，否则 Jackson 默认按 UTC 输出，
# 返回给调用方的时间会比数据库里的快 7 小时（冬令时是 8 小时）
spring.jackson.time-zone=America/Los_Angeles

mybatis.mapper-locations=classpath:mapper/*.xml