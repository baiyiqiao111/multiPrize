server.port=8085

spring.application.name=prize_sender
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/prize_sender?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Los_Angeles
spring.datasource.username=root
spring.datasource.password=root

# 必须与 serverTimezone、JVM 默认时区保持一致，否则 Jackson 默认按 UTC 输出，
# 返回给调用方的时间会比数据库里的快 7 小时（冬令时是 8 小时）
spring.jackson.time-zone=America/Los_Angeles

mybatis.mapper-locations=classpath:mapper/*.xml