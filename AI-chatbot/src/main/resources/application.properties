spring.application.name=ai-chatbot
server.port=8088

# ========== 服务注册（Eureka） ==========
# 注册中心地址，部署时可通过环境变量 EUREKA_SERVER_URL 覆盖
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://107.22.136.67:8761/eureka/}
# 以 IP 注册（而不是主机名），IP 变化后实例重启会自动注册新地址
eureka.instance.prefer-ip-address=true
# 注册时上报公网 IP（EC2 网卡上只有内网 IP），保证本地和服务器上的服务都能访问到该实例；可通过环境变量 EUREKA_INSTANCE_IP 覆盖
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:107.22.136.67}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://107.22.136.67:3306/music?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Los_Angeles
spring.datasource.username=bella
spring.datasource.password=Bella0924@

# 必须与 serverTimezone、JVM 默认时区保持一致，否则 Jackson 默认按 UTC 输出，
# 返回给前端的时间会比数据库里的快 7 小时（冬令时是 8 小时）
spring.jackson.time-zone=America/Los_Angeles

# OpenAI??
openai.api-url=https://api.openai.com/v1/chat/completions
openai.model=gpt-5.4-mini
openai.temperature=0.7
# MCP???????????????token??
openai.max-message-size=16

# Spring AI (ChatClient / MusicAgent) 走独立的配置前缀，必须单独提供凭证
# base-url 不要自己填：Spring AI 2.0 会把它原样交给 openai-java SDK，
# 其默认值已包含 /v1（少了 /v1 会得到一个无消息体的 404）
spring.ai.openai.api-key=${openai.api-key}
spring.ai.openai.chat.options.model=${openai.model}
spring.ai.openai.chat.options.temperature=${openai.temperature}